<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E6B4F"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF2EF;--surface:#fff;--ink:#12251F;--mute:#5E6F68;--line:#D3DDD8;--accent:#0E6B4F;--accent-ink:#fff;--warn:#B3402A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A16;--surface:#16251F;--ink:#E6EFEA;--mute:#9BB0A7;--line:#2A4037;--accent:#46C79B;--accent-ink:#08140F;--warn:#F0907A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A16;--surface:#16251F;--ink:#E6EFEA;--mute:#9BB0A7;--line:#2A4037;--accent:#46C79B;--accent-ink:#08140F;--warn:#F0907A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:15px;font-weight:600;margin:0;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pills{display:flex;gap:6px}
button,input,select,textarea{font:inherit;color:inherit}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{margin:22px 0 8px}
.hero .lbl{color:var(--mute);font-size:14px}
.hero .big{font-size:clamp(38px,12vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 12px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.split i{display:block;background:var(--accent)}
.split i+i{background:var(--ink);opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px;color:var(--mute)}
.legend b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;margin:20px 0 14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--mute);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat span{display:block;color:var(--mute);font-size:13px}
.stat b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pos{color:var(--accent)}.neg{color:var(--warn)}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar div{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--mute)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.form .full{grid-column:1/-1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input.amt{width:116px;text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
.x{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.msg{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px);padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;max-width:92%}
.msg.user{background:var(--ink);color:var(--bg);margin-left:auto}
.msg.assistant{background:var(--surface);border:1px solid var(--line)}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{resize:none;height:44px}
.note{color:var(--mute);font-size:13px;margin-top:8px}
.pill,.chip,.btn,nav button,.x{transition:background-color .2s,color .2s,border-color .2s,transform .12s ease}
.pill:active,.chip:active,.btn:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.enter #view{animation:rise .24s ease-out both}
.enter .split i,.enter .bar i{transform-origin:left center;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
.msg.new{animation:pop .26s ease-out both}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
.row{transition:opacity .18s,transform .18s}
.row.out{opacity:0;transform:translateX(14px)}
#saved:not(:empty){animation:rise .3s ease-out both}
.top h1{flex:1;margin-left:10px}
.ava,.bigava{background:var(--bg) center/cover;display:grid;place-items:center;font-weight:600}
.ava{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--ink);font-size:12px;cursor:pointer;padding:0;flex:none}
.bigava{width:96px;height:96px;border-radius:50%;border:1px solid var(--line);font-size:28px;font-weight:800}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog[open]{animation:pop .24s ease-out}
.abox{padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.abox h2,.abox p{margin:0}
a{color:var(--accent)}
.pill.danger{border-color:var(--warn);color:var(--warn)}
.fl{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.big2{font-size:clamp(30px,10vw,44px);font-weight:800;letter-spacing:-.03em}
.tip{display:grid;gap:2px;padding:6px 0 6px 12px;border-left:3px solid var(--line);margin:10px 0}
.tip.good{border-left-color:var(--accent)}
.tip.warn{border-left-color:var(--warn)}
.tip span{color:var(--mute);font-size:14px}
.pa{display:inline-grid;place-items:center;border-radius:50%;background:var(--bg) center/cover;border:1px solid var(--line);font-weight:600;font-size:12px;vertical-align:middle;margin-right:8px;flex:none;color:var(--ink)}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.prow .pa{margin:0;font-size:20px}
.pbtn{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;gap:6px;margin-bottom:8px}
.dpw{margin:6px 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><button class="ava" id="avaBtn" data-act="about" aria-label="About this app"></button><h1>My Money</h1><div class="pills" id="pills"></div></div>
  <section class="hero" id="hero"></section>
  <nav id="tabs" role="tablist"></nav>
  <div id="view"></div>
</main>
<dialog id="about" aria-labelledby="abt"><div class="abox"><div class="bigava" id="bigAva"></div><h2 id="abt">Binod Kunwar</h2><p class="note">Maker of My Money</p><p><a href="https://www.instagram.com/urself_binod?vrfl=NXB5MDIwZ2d3YmQx" target="_blank" rel="noopener">@urself_binod</a> on Instagram</p><button class="pill" data-act="photo">Change photo</button><input type="file" id="photo" accept="image/*" hidden><p class="note">Your photo stays on this device. My Money keeps your numbers here too. Only the AI chat and AI plan send the selected profile’s figures to Anthropic, using your own API key, to answer you.</p><button class="btn" data-act="closeAbout">Close</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const KKEY='mymoney.key';
const getKey=()=>{try{return localStorage.getItem(KKEY)||''}catch(e){return ''}};
window.claude={use:async n=>n==='sample'?async function(input,opts){
  const key=getKey();if(!key)throw{code:'no_key'};
  const messages=typeof input==='string'?[{role:'user',content:input}]:input;
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:900,messages})})}catch(e){throw{code:'network'}}
  if(r.status===401||r.status===403)throw{code:'bad_key'};
  if(r.status===429)throw{code:'rate_limited'};
  if(!r.ok)throw{code:'error'};
  const d=await r.json();const text=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(opts&&opts.onText)opts.onText({text});return{text};
}:null};
function keyCard(){const has=!!getKey();return `<div class="card"><h2>AI key</h2>${has?'<p class="note">An API key is saved on this device.</p><button class="pill" data-act="keyDel">Remove key</button>':'<p class="note">The AI needs your own Anthropic API key. It is stored only on this device and sent only to Anthropic. Each question costs a small amount.</p><input type="password" id="akey" autocomplete="off" placeholder="Paste your API key"><button class="btn" style="margin-top:8px" data-act="keySave">Save key</button>'}</div>`}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const c=CUR();return (n<0?'−':'')+c[0]+new Intl.NumberFormat(c[1],{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)))};
const KEY='mymoney.v1';
const CATS=['Food','Rent','Transport','Bills','Shopping','Health','Fun','Other'];
const TYPES=['Stocks','Mutual fund','Fixed deposit','Gold','Other'];
const COUNTRY={'India':['₹','en-IN'],'United States':['$','en-US'],'United Kingdom':['£','en-GB'],'UAE':['AED ','en-AE'],'Canada':['C$','en-CA'],'Australia':['A$','en-AU'],'Singapore':['S$','en-SG'],'Germany':['€','de-DE'],'Other':['','en-US']};
const CUR=()=>COUNTRY[(S.profiles[S.active]||{}).country]||COUNTRY.India;
const OCC=['Student','Corporate job','Self-employed','Homemaker','Other'];
const GEN=['Male','Female','Other','Prefer not to say'];
const DEBT=['Home loan','Car loan','Two-wheeler loan','Personal loan','Education loan','Gold loan','Credit card','Business loan','Other'];
const opts=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const TABS=[['overview','Overview'],['banks','Bank accounts'],['inv','Investments'],['spend','Spending'],['debt','Loans and EMIs'],['future','Future net worth'],['tips','Suggestions'],['ai','Ask AI']];
const blank=n=>({name:n,country:'India',phone:'',email:'',occupation:'',gender:'',income:0,accounts:[],investments:[],spending:[],debts:[]});
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.profiles&&d.profiles.length===2)return d}}catch(e){}return{active:0,profiles:[blank('Person 1'),blank('Person 2')]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
let S=load(),tab='overview';const chat=[[],[]];let busy=false;const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;let shown=null,del=null;
const P=()=>{const p=S.profiles[S.active];if(!p.debts)p.debts=[];if(!p.country)p.country='India';return p};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=id=>Math.max(0,parseFloat($('#'+id).value)||0);
function totals(p){
  const bank=p.accounts.reduce((a,x)=>a+x.amount,0);
  const inv=p.investments.reduce((a,x)=>a+x.current,0);
  const put=p.investments.reduce((a,x)=>a+x.invested,0);
  const m=p.spending.filter(x=>x.date.startsWith(today().slice(0,7)));
  const spent=m.reduce((a,x)=>a+x.amount,0);
  const cats={};m.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
  const owed=p.debts.reduce((a,x)=>a+x.outstanding,0),emi=p.debts.reduce((a,x)=>a+x.emi,0);
  return{bank,inv,put,spent,cats,m,owed,emi};
}
function renderHead(){
  const p=P(),t=totals(p),assets=t.bank+t.inv,nw=assets-t.owed,pct=assets>0?t.bank/assets*100:0;
  $('#pills').innerHTML=S.profiles.map((q,i)=>`<button class="pill" data-act="profile:${i}" aria-pressed="${i===S.active}">${esc(q.name)}</button>`).join('');
  $('#hero').innerHTML=`<div class="lbl">${pav(p,24)}${esc(p.name)}’s net worth</div><div class="big">${fmt(nw)}</div>
  <div class="split" aria-hidden="true"><i style="width:${pct}%"></i><i style="width:${assets>0?100-pct:0}%"></i></div>
  <div class="legend"><span>Bank <b>${fmt(t.bank)}</b></span><span>Investments <b>${fmt(t.inv)}</b></span><span>Debt <b>${fmt(t.owed)}</b></span></div>`;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-act="tab:${k}" aria-selected="${k===tab}">${l}</button>`).join('');
  const big=$('#hero .big');if(shown!==null&&shown!==nw&&!REDUCED){const from=shown,t0=performance.now(),step=t=>{const k=Math.min(1,(t-t0)/450);big.textContent=fmt(from+(nw-from)*(1-Math.pow(1-k,3)));if(k<1&&big.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)}
  shown=nw;
}
function vOverview(p){
  const t=totals(p),gain=t.inv-t.put,left=p.income-t.spent-t.emi,share=p.income?Math.round(t.emi/p.income*100):0;
  const cats=Object.entries(t.cats).sort((a,b)=>b[1]-a[1]),max=cats.length?cats[0][1]:1;
  return `<div class="stats">
    <div class="stat"><span>Spent this month</span><b>${fmt(t.spent)}</b></div>
    <div class="stat"><span>Left after spending and EMIs</span><b class="${left<0?'neg':''}">${p.income?fmt(left):'Set income'}</b></div>
    <div class="stat"><span>Invested</span><b>${fmt(t.put)}</b></div>
    <div class="stat"><span>Investment gain</span><b class="${gain<0?'neg':'pos'}">${gain>=0?'+':'−'}${fmt(Math.abs(gain))}</b></div><div class="stat"><span>Monthly EMIs</span><b>${fmt(t.emi)}</b></div><div class="stat"><span>EMIs as share of income</span><b class="${share>50?'neg':''}">${p.income?share+'%':'Set income'}</b></div></div>
  <div class="card" style="margin-top:14px"><h2>Where this month’s money went</h2>
  ${cats.length?cats.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><div><i style="width:${v/max*100}%"></i></div><span>${fmt(v)}</span></div>`).join(''):'<p class="empty">No spending added for this month yet. Add some in the Spending tab.</p>'}</div>
  ${p.done?`<div class="card"><h2>${pav(p,32)}${esc(p.name)}</h2><p class="note">${esc([p.occupation,p.country].filter(Boolean).join(', '))}${p.income?', income '+fmt(p.income)+' a month':''}</p><p class="note" id="saved" role="status"></p><button class="btn" data-act="editProfile">Edit profile</button></div>`:`<div class="card"><h2>About ${esc(p.name)}</h2><div class="prow">${pav(p,56)}<div class="pbtn"><button class="pill" data-act="ppic">${p.photo?'Change photo':'Add photo'}</button>${p.photo?'<button class="pill" data-act="ppicx">Remove photo</button>':''}</div><input type="file" id="ppicf" accept="image/*" hidden></div><div class="form"><input class="full" data-edit="name" value="${esc(p.name)}" maxlength="20" placeholder="Name" aria-label="Name"><select data-edit="occupation" aria-label="Occupation">${opts(OCC,p.occupation,'Occupation')}</select><select data-edit="gender" aria-label="Gender">${opts(GEN,p.gender,'Gender')}</select><select class="full" data-edit="country" aria-label="Country">${Object.keys(COUNTRY).map(x=>`<option${x===p.country?' selected':''}>${x}</option>`).join('')}</select><input class="full" type="number" inputmode="decimal" data-edit="income" value="${p.income||''}" placeholder="Monthly income (optional)" aria-label="Monthly income"><input class="full" type="tel" inputmode="tel" autocomplete="tel" data-edit="phone" value="${esc(p.phone||'')}" placeholder="Phone number (optional), with country code" aria-label="Phone number"><input class="full" type="email" inputmode="email" autocomplete="email" data-edit="email" value="${esc(p.email||'')}" placeholder="Email (optional)" aria-label="Email">${p.pw?'<input class="full" type="password" id="pw0" autocomplete="current-password" maxlength="40" placeholder="Current password (only to change it)">':''}<input class="full" type="password" id="pw1" autocomplete="new-password" maxlength="40" placeholder="${p.pw?'New password (leave blank to keep)':'Password (optional), needed to delete data'}"><button class="btn full" data-act="save">Save profile</button><p class="note full" id="saved" role="status"></p></div><p class="note">The AI uses these details to tailor its answers. Your phone number, email and password are never sent to the AI. The password only protects deleting data inside this app and can’t be recovered. Everything is saved in this browser only.</p></div>`}<div class="card"><h2>Your data</h2>${del?delPanel(p):'<button class="pill" data-act="delOpen">Delete data…</button><p class="note">Choose what to delete. If you set a password in your profile, you’ll need it.</p>'}</div>`;
}
function vBanks(p){
  return `<div class="card"><h2>Bank accounts</h2>
  ${p.accounts.length?p.accounts.map(a=>`<div class="row"><div class="grow"><b>${esc(a.name)}</b></div><input class="amt" type="number" inputmode="decimal" value="${a.amount}" data-edit="acc:${a.id}" aria-label="Balance of ${esc(a.name)}"><button class="x" data-act="delAcc:${a.id}" aria-label="Remove ${esc(a.name)}">×</button></div>`).join(''):'<p class="empty">Add your first bank account to start your net worth.</p>'}
  <div class="form"><input id="an" placeholder="Account name, e.g. Savings account"><input id="aa" type="number" inputmode="decimal" placeholder="Balance"><button class="btn full" data-act="addAcc">Add account</button></div></div>`;
}
function vInv(p){
  return `<div class="card"><h2>Investments</h2>
  ${p.investments.length?p.investments.map(i=>{const g=i.current-i.invested,pc=i.invested?g/i.invested*100:0;return `<div class="row"><div class="grow"><b>${esc(i.name)}</b><small>${esc(i.type)} · put in ${fmt(i.invested)} · <span class="${g<0?'neg':'pos'}">${g>=0?'+':'−'}${Math.abs(pc).toFixed(1)}%</span></small></div><input class="amt" type="number" inputmode="decimal" value="${i.current}" data-edit="inv:${i.id}" aria-label="Current value of ${esc(i.name)}"><button class="x" data-act="delInv:${i.id}" aria-label="Remove ${esc(i.name)}">×</button></div>`}).join(''):'<p class="empty">Add stocks, mutual funds, deposits or gold. Update the current value whenever you like.</p>'}
  <div class="form"><input id="in" class="full" placeholder="Name, e.g. Index fund"><select id="it">${TYPES.map(x=>`<option>${x}</option>`).join('')}</select><input id="ii" type="number" inputmode="decimal" placeholder="Amount put in"><input id="ic" class="full" type="number" inputmode="decimal" placeholder="Current value, blank if same"><button class="btn full" data-act="addInv">Add investment</button></div></div>`;
}
function vSpend(p){
  const t=totals(p),list=[...t.m].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h2>Add spending</h2><div class="form"><input id="sa" type="number" inputmode="decimal" placeholder="Amount"><select id="sc">${CATS.map(x=>`<option>${x}</option>`).join('')}</select><input id="sn" placeholder="Note (optional)"><input id="sd" type="date" value="${today()}"><button class="btn full" data-act="addSp">Add spending</button></div></div>
  <div class="card"><h2>This month · ${fmt(t.spent)}</h2>
  ${list.length?list.map(s=>`<div class="row"><div class="grow"><b>${esc(s.category)}</b><small>${esc(s.date)}${s.note?' · '+esc(s.note):''}</small></div><span>${fmt(s.amount)}</span><button class="x" data-act="delSp:${s.id}" aria-label="Remove">×</button></div>`).join(''):'<p class="empty">Nothing spent yet this month.</p>'}</div>`;
}

document.addEventListener('change',e=>{if(e.target.id!=='ppicf')return;const f=e.target.files[0];if(!f)return;shrink(f,128,u=>{P().photo=u;save();render()})});
paintAva();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
